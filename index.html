<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c1c1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Helix" />
    <title>Helix</title>
    <meta name="description" content="Overall health tracker" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var KEY = "helix-theme";
        var DARK = "#1c1c1e";
        var LIGHT = "#e7e8ee";
        var theme = "system";
        try {
          var stored = localStorage.getItem(KEY);
          if (stored === "light" || stored === "dark" || stored === "system") theme = stored;
        } catch (e) {}
        var prefersDark = true;
        try {
          prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        var dark = theme === "dark" || (theme === "system" && prefersDark);
        var root = document.documentElement;
        if (dark) root.classList.remove("light");
        else root.classList.add("light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? DARK : LIGHT);
        window.__HELIX_THEME_BOOTED = true;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
